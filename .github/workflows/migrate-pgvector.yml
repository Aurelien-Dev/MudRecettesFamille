name: Migrate PostgreSQL to pgvector

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "MIGRATE" to confirm'
        required: true
        default: ''

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'MIGRATE'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Update docker-compose.yml
      run: |
        cd src/RecettesFamille.Docker
        sed -i 's/image: postgres:17/image: pgvector\/pgvector:pg17/g' docker-compose.yml
        cat docker-compose.yml | grep pgvector

    - name: Copy updated docker-compose.yml to VPS
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        password: ${{ secrets.DEPLOY_PASSWORD }}
        source: "src/RecettesFamille.Docker/docker-compose.yml"
        target: /home/recettesfamille/
        strip_components: 2

    - name: Backup database (safety)
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        password: ${{ secrets.DEPLOY_PASSWORD }}
        script: |
          echo "📦 Creating database backup..."
          docker exec recettesfamille.data pg_dump -U pguser -d recettesfamilledb > /home/data/backup_pgvector_migration_$(date +%Y%m%d_%H%M%S).sql
          echo "✅ Backup created in /home/data/"

    - name: Migrate PostgreSQL to pgvector
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        password: ${{ secrets.DEPLOY_PASSWORD }}
        script: |
          cd /home/recettesfamille/src/RecettesFamille.Docker

          echo "🛑 Stopping PostgreSQL container..."
          docker-compose stop recettesfamille.data

          echo "🗑️ Removing old container (data is safe in volume)..."
          docker-compose rm -f recettesfamille.data

          echo "🚀 Pulling pgvector/pgvector:pg17 image..."
          docker pull pgvector/pgvector:pg17

          echo "⚙️ Starting PostgreSQL with pgvector..."
          docker-compose up -d recettesfamille.data

          echo "⏳ Waiting for PostgreSQL to be ready..."
          sleep 10

          echo "🔌 Enabling pgvector extension..."
          docker exec recettesfamille.data psql -U pguser -d recettesfamilledb -c "CREATE EXTENSION IF NOT EXISTS vector;"

          echo "✅ Verifying pgvector installation..."
          docker exec recettesfamille.data psql -U pguser -d recettesfamilledb -c "\dx vector"

          echo "🎉 Migration completed successfully!"

    - name: Commit updated docker-compose.yml
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add src/RecettesFamille.Docker/docker-compose.yml
        git diff --cached --exit-code || git commit -m "chore: migrate PostgreSQL to pgvector/pgvector:pg17"
        git push
