name: Rollback pgvector Migration (Emergency)

on:
  workflow_dispatch:
    inputs:
      backup_file:
        description: 'Backup filename (from /home/data/)'
        required: true
        default: 'backup_pgvector_migration_YYYYMMDD_HHMMSS.sql'

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
    - name: Restore database backup
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        password: ${{ secrets.DEPLOY_PASSWORD }}
        script: |
          echo "🚨 ROLLBACK: Restoring database backup..."

          if [ ! -f "/home/data/${{ github.event.inputs.backup_file }}" ]; then
            echo "❌ Backup file not found: /home/data/${{ github.event.inputs.backup_file }}"
            exit 1
          fi

          echo "📂 Found backup: ${{ github.event.inputs.backup_file }}"

          # Restore backup
          docker exec -i recettesfamille.data psql -U pguser -d recettesfamilledb < /home/data/${{ github.event.inputs.backup_file }}

          echo "✅ Database restored successfully!"
          echo "⚠️ Note: Container is still using pgvector/pgvector:pg17 image"
          echo "   This is safe - pgvector is backward compatible with standard PostgreSQL data"
